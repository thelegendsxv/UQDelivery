spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
app:
  admin:
    # En produccion no hay valores por defecto: si no se definen, no se crea administrador.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # HU-03: en produccion el enlace nunca va al log; requiere MAIL_* y FRONTEND_URL.
  password-reset:
    frontend-url: ${FRONTEND_URL}
    log-link: false